<!DOCTYPE html>
<html>
<head>
<title>SHMS Login</title>

<style>
body{
font-family:Arial;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
background:white;
padding:30px;
border-radius:10px;
width:300px;
box-shadow:0px 0px 20px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Hospital Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

fetch("http://localhost:8080/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username:username,
password:password
})

})

.then(res => res.json())
.then(data => {

if(data.success){

// store role
localStorage.setItem("role",data.role);

// redirect to dashboard
window.location.href = "dashboard.html";

}
else{
alert("Invalid username or password");
}

})

.catch(err=>{
alert("Server error");
});

}

</script>

</body>
</html>
