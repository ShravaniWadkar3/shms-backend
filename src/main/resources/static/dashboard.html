<!DOCTYPE html>
<html>
<head>
<title>SHMS Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
background:#f1f5f9;
}

/* SIDEBAR */
.sidebar{
width:250px;
height:100vh;
background:#1e293b;
color:white;
padding:20px;
position:fixed;
}

.sidebar h2{
margin-bottom:20px;
}

.sidebar button{
width:100%;
padding:12px;
margin:8px 0;
background:#334155;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
text-align:left;
}

.sidebar button:hover{
background:#475569;
}

/* MAIN */
.main{
margin-left:250px;
width:100%;
}

/* TOP BAR */
.topbar{
background:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0px 2px 5px rgba(0,0,0,0.1);
}

/* CONTENT */
.content{
padding:20px;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 2px 5px rgba(0,0,0,0.1);
text-align:center;
}

.card h3{
color:gray;
}

/* MODULE AREA */
.box{
background:white;
padding:20px;
border-radius:10px;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h2>🏥 SHMS</h2>

<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('patients')">Patients</button>
<button onclick="show('doctors')">Doctors</button>
<button onclick="show('appointments')">Appointments</button>
<button onclick="logout()">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
<h3>Smart Hospital System</h3>
<p id="userRole"></p>
</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard" class="section">

<div class="cards">

<div class="card">
<h3>Patients</h3>
<h1>120</h1>
</div>

<div class="card">
<h3>Doctors</h3>
<h1>25</h1>
</div>

<div class="card">
<h3>Appointments</h3>
<h1>80</h1>
</div>

<div class="card">
<h3>Revenue</h3>
<h1>₹50,000</h1>
</div>

</div>

</div>

<!-- PATIENTS -->
<div id="patients" class="section" style="display:none;">
<div class="box">
<h2>Patients Module</h2>
<p>Here you will connect API later</p>
</div>
</div>

<!-- DOCTORS -->
<div id="doctors" class="section" style="display:none;">
<div class="box">
<h2>Doctors Module</h2>
<p>Manage doctors here</p>
</div>
</div>

<!-- APPOINTMENTS -->
<div id="appointments" class="section" style="display:none;">
<div class="box">
<h2>Appointments Module</h2>
<p>Manage bookings here</p>
</div>
</div>

</div>

</div>

<script>

// SHOW SECTIONS
function show(id){

let sections =
document.querySelectorAll(".section");

sections.forEach(s=>{
s.style.display="none";
});

document.getElementById(id).style.display="block";

}

// SHOW ROLE
document.getElementById("userRole").innerText =
"Role: " + localStorage.getItem("role");

// LOGOUT
function logout(){
localStorage.clear();
window.location.href="login.html";
}

</script>

</body>
</html>
